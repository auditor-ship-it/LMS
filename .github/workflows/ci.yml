# Runs on every push and pull request. Catches breakage BEFORE it can reach
# main, so the deploy workflow (deploy.yml) is only ever handed code that has
# already been linted, built and smoke-tested.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node 20 to match the VPS runtime exactly (node v20.20.2 there).
      # Building on a newer major than production can hide syntax/API problems
      # that only surface after deploy.
      #
      # This is unrelated to the "Node.js 20 is deprecated" warning GitHub
      # emits: that is about the runtime the ACTIONS themselves run on (fixed
      # by using @v5 actions above), not the Node this project builds with.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          # REQUIRED here, not optional. frontend/.env is gitignored, so on a
          # CI runner there is nothing to supply this and the build silently
          # falls back to http://localhost:4001/api — which the assert below
          # would then flag, failing every single run. Same value as deploy.yml
          # so CI builds exactly what production builds.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://lease.crystalgrp.xyz/api' }}

      # The backend has no test suite, so this is the honest substitute: import
      # every module so a syntax error, a bad import path or a missing export
      # fails the build. It also carries the case-sensitivity check that caught
      # the class of bug behind commit c88461a.
      - name: Smoke-test backend modules
        working-directory: backend
        run: node ../.github/scripts/smoke-import.mjs
        env:
          # Dummy values so config/env.js passes its required-vars gate. These
          # never connect to anything - the check is "does the code load", not
          # "does it talk to Google/Mongo".
          GOOGLE_PROJECT_ID: ci
          GOOGLE_CLIENT_EMAIL: ci@example.com
          GOOGLE_PRIVATE_KEY: ci
          GOOGLE_SHEET_ID: ci
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGO_DB_NAME: ci

      # The frontend bakes its API URL in at BUILD time and silently falls back
      # to http://localhost:4001/api when VITE_API_URL is unset - which, served
      # to a browser, points at the USER'S machine rather than the server. This
      # asserts the value above actually reached the build.
      - name: Assert no localhost API URL in the bundle
        run: |
          if grep -rq 'localhost:4001' frontend/dist/assets 2>/dev/null; then
            echo '::error::Built bundle contains http://localhost:4001 - VITE_API_URL did not reach the build.'
            exit 1
          fi
          echo 'OK - no localhost fallback baked into the bundle'
