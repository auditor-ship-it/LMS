# Claude Code agent for this repo.
# Mention @claude in an issue or PR comment to ask a question, get a review,
# or have it open a PR. It only acts for users with WRITE access, and it can
# never merge: a human reviews and merges every PR.
#
# One-time setup (repo admin):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add secret ANTHROPIC_API_KEY under Settings → Secrets and variables → Actions
# Until both are done, this workflow does nothing harmful — it simply fails
# when someone mentions @claude.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 20"
