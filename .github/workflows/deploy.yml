# Merge to main -> build, verify, deploy to the VPS, then prove the running
# process is actually the new code.
#
# Why the last step matters: production ran a NINE DAY OLD process because
# files were uploaded and nothing restarted the service. Node reads source
# once at boot, so "the files are correct" proves nothing. This workflow fails
# if the restarted process is not demonstrably new.
name: Deploy to production

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# One deploy at a time. Two concurrent rsyncs into the same directory would
# interleave files and could leave the app half-updated.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- verify
  # Deliberately a SEPARATE job from deploy: if anything here fails, the
  # deploy job never starts and production is untouched.
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'   # matches the VPS runtime (v20.20.2)

      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          # Baked in at BUILD time. A repo variable so it is visible and
          # editable without touching this file; falls back to the known
          # production URL so a missing variable cannot silently produce a
          # localhost bundle.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://lease.crystalgrp.xyz/api' }}

      - name: Assert no localhost API URL in the bundle
        run: |
          if grep -rq 'localhost:4001' frontend/dist/assets 2>/dev/null; then
            echo '::error::Bundle contains http://localhost:4001 - VITE_API_URL was not applied.'
            exit 1
          fi
          echo 'OK - bundle points at the production API'

      - name: Smoke-test backend modules
        working-directory: backend
        run: node ../.github/scripts/smoke-import.mjs
        env:
          # Dummy values so config/env.js passes its required-vars gate. These
          # never connect to anything - the check is "does the code load", not
          # "does it talk to Google/Mongo".
          GOOGLE_PROJECT_ID: ci
          GOOGLE_CLIENT_EMAIL: ci@example.com
          GOOGLE_PRIVATE_KEY: ci
          GOOGLE_SHEET_ID: ci
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGO_DB_NAME: ci

      - name: Upload build for the deploy job
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ---------------------------------------------------------------- deploy
  deploy:
    name: Deploy to VPS
    needs: verify          # only runs if verify passed
    runs-on: ubuntu-latest
    # Secrets are read into the environment ONCE here rather than interpolated
    # into each shell line. A ${{ }} inside a script pastes the raw value into
    # the command text, which breaks on any special character and makes a
    # multi-line SSH key impossible to quote correctly.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://lease.crystalgrp.xyz' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the verified build
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

      # Fails with a NAMED list of what is missing. Without this the first ssh
      # simply exits 255 and the log says nothing about why.
      - name: Preflight - required secrets are present
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=''
          [ -n "$VPS_HOST" ]    || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ]    || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo 'Add them under Settings > Secrets and variables > Actions > Repository secrets.'
            echo '  VPS_HOST     the server address'
            echo '  VPS_USER     the deploy account'
            echo '  VPS_SSH_KEY  the PRIVATE half of the deploy keypair, the whole file including its BEGIN/END lines'
            exit 1
          fi
          echo 'OK - all three secrets are set'

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Fail HERE, with a readable message, rather than three steps later
          # inside an rsync error nobody can interpret.
          if ! ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'echo connected'; then
            echo '::error::SSH authentication to the VPS failed. Check that VPS_SSH_KEY is the PRIVATE key whose PUBLIC half is in the deploy account authorized_keys.'
            exit 1
          fi

      - name: Back up the current release
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd ~/app && mkdir -p ~/backups && tar czf ~/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).tar.gz backend/src frontend/dist 2>/dev/null; ls -t ~/backups/*.tar.gz | tail -n +11 | xargs -r rm --'

      # --delete keeps the server free of files deleted in git (e.g. the
      # Agreement Form / Return Dashboard pages). Scoped to src and dist ONLY:
      # backend/.env lives outside both and must survive, and
      # /etc/lease-management/lease-management.env is root-owned and never
      # touched by this workflow.
      - name: Sync backend source
        run: |
          rsync -az --delete -e 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes' \
            backend/src/ "$VPS_USER@$VPS_HOST:~/app/backend/src/"
          rsync -az -e 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes' \
            backend/package.json backend/package-lock.json \
            "$VPS_USER@$VPS_HOST:~/app/backend/"

      - name: Sync built frontend
        run: |
          rsync -az --delete -e 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes' \
            frontend/dist/ "$VPS_USER@$VPS_HOST:~/app/frontend/dist/"

      - name: Install production dependencies
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd ~/app/backend && npm ci --omit=dev --no-audit --no-fund'

      # THE step this whole workflow exists for. The service runs as the deploy
      # user with Restart=always and RestartSec=5, so SIGTERM IS a restart - no
      # sudo needed (the account has no passwordless sudo). Waits for a NEW pid
      # and a 200 from /api/health before declaring success.
      - name: Restart backend and wait for it to come up
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes .github/scripts/restart-backend.sh \
            "$VPS_USER@$VPS_HOST:/tmp/restart-backend.sh"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'bash /tmp/restart-backend.sh; rc=$?; rm -f /tmp/restart-backend.sh; exit $rc'

      # Proves the PUBLIC site is serving the new process, not merely that a
      # process exists. A stale startedAt means the restart silently did
      # nothing, which is exactly the failure this pipeline exists to catch.
      - name: Verify the live site is running the new build
        run: bash .github/scripts/verify-live.sh "$PUBLIC_URL"
